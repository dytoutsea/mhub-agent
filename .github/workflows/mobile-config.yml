name: Mobile CI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release_metadata:
    name: Resolve release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      activation_api_url: ${{ steps.release.outputs.activation_api_url }}
      relay_control_url: ${{ steps.release.outputs.relay_control_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag and resolve owning branch
        id: release
        shell: bash
        env:
          DEV_AGENT_ACTIVATION_API_URL: ${{ vars.MHUB_DEV_AGENT_ACTIVATION_API_URL }}
          DEV_RELAY_CONTROL_URL: ${{ vars.MHUB_DEV_RELAY_CONTROL_URL }}
          PROD_AGENT_ACTIVATION_API_URL: ${{ vars.MHUB_PROD_AGENT_ACTIVATION_API_URL }}
          PROD_RELAY_CONTROL_URL: ${{ vars.MHUB_PROD_RELAY_CONTROL_URL }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3"
            exit 1
          fi

          tagged_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev

          if git merge-base --is-ancestor "$tagged_commit" origin/main; then
            channel="main"
            activation_api_url="$PROD_AGENT_ACTIVATION_API_URL"
            relay_control_url="$PROD_RELAY_CONTROL_URL"
          elif git merge-base --is-ancestor "$tagged_commit" origin/dev; then
            channel="dev"
            activation_api_url="$DEV_AGENT_ACTIVATION_API_URL"
            relay_control_url="$DEV_RELAY_CONTROL_URL"
          else
            echo "Tagged commit $tagged_commit is not contained in origin/main or origin/dev"
            exit 1
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "activation_api_url=$activation_api_url" >> "$GITHUB_OUTPUT"
          echo "relay_control_url=$relay_control_url" >> "$GITHUB_OUTPUT"

  config:
    needs: release_metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MHUB_RELEASE_CHANNEL: ${{ needs.release_metadata.outputs.channel }}
      MHUB_AGENT_ACTIVATION_API_URL: ${{ needs.release_metadata.outputs.activation_api_url }}
      MHUB_RELAY_CONTROL_URL: ${{ needs.release_metadata.outputs.relay_control_url }}
      EXPO_PUBLIC_MHUB_RELEASE_CHANNEL: ${{ needs.release_metadata.outputs.channel }}
      EXPO_PUBLIC_MHUB_AGENT_ACTIVATION_API_URL: ${{ needs.release_metadata.outputs.activation_api_url }}
      EXPO_PUBLIC_MHUB_RELAY_CONTROL_URL: ${{ needs.release_metadata.outputs.relay_control_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ensure:platform-deps
      - run: npm run client:config:check
      - name: Validate Expo config
        run: |
          npm exec --workspace @mhub/mobile -- expo config --type public --json > /tmp/mhub-expo-config.json
          node -e "const c=require('/tmp/mhub-expo-config.json'); if(c.name !== '黄雀云Agent' || c.icon !== './assets/mhub-agent.png' || c.android.versionCode !== 1 || c.ios.buildNumber !== '1') throw new Error('Expo metadata mismatch')"
          node -e "JSON.parse(require('fs').readFileSync('apps/mobile/eas.json', 'utf8')); JSON.parse(require('fs').readFileSync('apps/mobile/app.json', 'utf8'))"
      - name: Export unsigned mobile bundle
        run: npm run build:mobile

  android-apk:
    name: Android APK
    needs: release_metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MHUB_RELEASE_CHANNEL: ${{ needs.release_metadata.outputs.channel }}
      MHUB_AGENT_ACTIVATION_API_URL: ${{ needs.release_metadata.outputs.activation_api_url }}
      MHUB_RELAY_CONTROL_URL: ${{ needs.release_metadata.outputs.relay_control_url }}
      EXPO_PUBLIC_MHUB_RELEASE_CHANNEL: ${{ needs.release_metadata.outputs.channel }}
      EXPO_PUBLIC_MHUB_AGENT_ACTIVATION_API_URL: ${{ needs.release_metadata.outputs.activation_api_url }}
      EXPO_PUBLIC_MHUB_RELAY_CONTROL_URL: ${{ needs.release_metadata.outputs.relay_control_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: npm ci
      - run: npm run ensure:platform-deps
      - run: npm run client:config:check
      - name: Generate Android project
        run: |
          npm run build:mobile
          npm exec --workspace @mhub/mobile -- expo prebuild --clean --no-install
          node scripts/check-mobile-native-boundary.mjs
      - name: Build unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^        release {/,/^        }/s/signingConfig signingConfigs.debug/signingConfig null/' \
            apps/mobile/android/app/build.gradle
          release_block="$(sed -n '/^        release {/,/^        }/p' apps/mobile/android/app/build.gradle)"
          if printf '%s\n' "$release_block" | grep -q 'signingConfig signingConfigs.debug'; then
            echo "Release signingConfig was not removed"
            exit 1
          fi
          chmod +x apps/mobile/android/gradlew
          (cd apps/mobile/android && ./gradlew --no-daemon --stacktrace assembleRelease)
          test -f apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Sign Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required Android signing secret is missing: $name"
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/mhub-agent-release.jks"
          trap 'rm -f "$keystore_path"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)/apksigner"
          test -x "$apksigner_path"
          mkdir -p apps/mobile/release
          "$apksigner_path" sign \
            --ks "$keystore_path" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out apps/mobile/release/mhub-agent-android-signed.apk \
            apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$apksigner_path" verify apps/mobile/release/mhub-agent-android-signed.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mhub-agent-android-signed
          path: apps/mobile/release/*.apk
          if-no-files-found: error
          retention-days: 14

  ios-unsigned:
    name: iOS unsigned simulator app
    needs: release_metadata
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      MHUB_RELEASE_CHANNEL: ${{ needs.release_metadata.outputs.channel }}
      MHUB_AGENT_ACTIVATION_API_URL: ${{ needs.release_metadata.outputs.activation_api_url }}
      MHUB_RELAY_CONTROL_URL: ${{ needs.release_metadata.outputs.relay_control_url }}
      EXPO_PUBLIC_MHUB_RELEASE_CHANNEL: ${{ needs.release_metadata.outputs.channel }}
      EXPO_PUBLIC_MHUB_AGENT_ACTIVATION_API_URL: ${{ needs.release_metadata.outputs.activation_api_url }}
      EXPO_PUBLIC_MHUB_RELAY_CONTROL_URL: ${{ needs.release_metadata.outputs.relay_control_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ensure:platform-deps
      - run: npm run client:config:check
      - name: Generate iOS project and install pods
        run: |
          npm run build:mobile
          npm exec --workspace @mhub/mobile -- expo prebuild --clean --no-install
          node scripts/check-mobile-native-boundary.mjs
          (cd apps/mobile/ios && pod install)
      - name: Build unsigned simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace apps/mobile/ios/Agent.xcworkspace \
            -scheme Agent \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/mhub-agent-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          app_path="$RUNNER_TEMP/mhub-agent-ios-derived/Build/Products/Release-iphonesimulator/Agent.app"
          test -d "$app_path"
          mkdir -p apps/mobile/release
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            apps/mobile/release/mhub-agent-ios-simulator-unsigned.zip
      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: mhub-agent-ios-simulator-unsigned
          path: apps/mobile/release/mhub-agent-ios-simulator-unsigned.zip
          if-no-files-found: error
          retention-days: 14
