name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - "apps/mobile/**"
      - "modules/mobile-data-tunnel/**"
      - "packages/mobile-runtime/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate Expo config
        run: |
          npm exec --workspace @mhub/mobile -- expo config --type public --json > /tmp/mhub-expo-config.json
          node -e "const c=require('/tmp/mhub-expo-config.json'); if(c.icon !== './assets/mhub-agent.png' || c.android.versionCode !== 1 || c.ios.buildNumber !== '1') throw new Error('Expo metadata mismatch')"
          node -e "JSON.parse(require('fs').readFileSync('apps/mobile/eas.json', 'utf8')); JSON.parse(require('fs').readFileSync('apps/mobile/app.json', 'utf8'))"
      - name: Export unsigned mobile bundle
        run: npm run build --workspace @mhub/mobile

  android-unsigned:
    name: Android unsigned APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: npm ci
      - name: Generate Android project
        run: |
          npm exec --workspace @mhub/mobile -- expo prebuild --clean --no-install
          node scripts/check-mobile-native-boundary.mjs
      - name: Build unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^        release {/,/^        }/s/signingConfig signingConfigs.debug/signingConfig null/' \
            apps/mobile/android/app/build.gradle
          release_block="$(sed -n '/^        release {/,/^        }/p' apps/mobile/android/app/build.gradle)"
          if printf '%s\n' "$release_block" | grep -q 'signingConfig signingConfigs.debug'; then
            echo "Release signingConfig was not removed"
            exit 1
          fi
          chmod +x apps/mobile/android/gradlew
          apps/mobile/android/gradlew --no-daemon --stacktrace assembleRelease
          mkdir -p apps/mobile/release
          test -f apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          cp apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            apps/mobile/release/mhub-agent-android-unsigned.apk
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: mhub-agent-android-unsigned
          path: apps/mobile/release/mhub-agent-android-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  ios-unsigned:
    name: iOS unsigned simulator app
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate iOS project and install pods
        run: |
          npm exec --workspace @mhub/mobile -- expo prebuild --clean --no-install
          node scripts/check-mobile-native-boundary.mjs
          pod install --project-directory=apps/mobile/ios
      - name: Build unsigned simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace apps/mobile/ios/MHubAgent.xcworkspace \
            -scheme MHubAgent \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/mhub-agent-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          app_path="$RUNNER_TEMP/mhub-agent-ios-derived/Build/Products/Release-iphonesimulator/MHubAgent.app"
          test -d "$app_path"
          mkdir -p apps/mobile/release
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            apps/mobile/release/mhub-agent-ios-simulator-unsigned.zip
      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: mhub-agent-ios-simulator-unsigned
          path: apps/mobile/release/mhub-agent-ios-simulator-unsigned.zip
          if-no-files-found: error
          retention-days: 14
