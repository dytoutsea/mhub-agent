name: Package Unsigned Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} unsigned artifact
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify shared and desktop source
        shell: bash
        run: |
          npm run check
          npm run typecheck
          npm run test
          npm run mobile:native:check
          npm run expo:check
      - name: Export Expo Web renderer
        run: npm run build --workspace @mhub/mobile
      - name: Build unsigned installer
        run: npm run package:unsigned --workspace @mhub/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhub-agent-${{ matrix.os }}-unsigned
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14
